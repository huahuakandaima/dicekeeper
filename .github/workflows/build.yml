# DiceKeeper CI：push 自动跑测试；打 v* 标签自动打包并发布 Release
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          # 国内拉 electron 二进制慢的问题在 GitHub runner 上不存在（海外）
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist-package/*.exe
          generate_release_notes: true
