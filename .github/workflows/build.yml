# DiceKeeper CI：每次 push 到 main 自动跑测试 + 自动打包 + 自动发布新版 Release
# 版本号自动递增（v0.1.0 → v0.1.1 → v0.1.2 …），Release notes 取最近提交信息
name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 计算递增版本号
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            VER="v0.1.0"
          else
            BASE=${LATEST#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            VER="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "本次版本：$VER"
      - name: 同步版本号到 package.json（产物文件名与版本一致）
        run: npm version "${{ steps.ver.outputs.ver }}" --no-git-tag-version
      - run: npm run dist:win
      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(git log -1 --pretty=%s)
          gh release create "${{ steps.ver.outputs.ver }}" dist-package/*.exe \
            --title "DiceKeeper ${{ steps.ver.outputs.ver }}" \
            --notes "自动发布：$MSG"
      # 同步递增后的版本号写回仓库（开发端窗口标题 app.getVersion() 读本地 package.json，
      # 不同步则开发端永远显示旧版本）；[skip ci] 防止本次 push 再触发 workflow 循环发版
      - name: 同步版本号回仓库
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: 同步版本号 ${{ steps.ver.outputs.ver }} [skip ci]" || echo "无版本变更"
          git push origin main
